# Site
name: "Mohammad Masah"
description: "Étudiant à Epitech | Portfolio"
lang: fr
locale: fr_FR
url: "https://mohammad-h.dev"
baseurl: ""
logo: "assets/images/logo.png"
email: "mohammad-haroon.masah@epitech.eu"

social:
  name: "Mohammad Masah"
  links:
    - https://www.linkedin.com/in/mohammad-masah
    - https://github.com/mohammadmasah

include: ["_pages"]
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag


  # all posts
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post

  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page




# English project pages use a native Jekyll collection (no extra plugin).
collections:
  projects_en:
    output: true
    permalink: /en/:name/

# Development checks and maintenance notes are not published.
exclude:
  - scripts
  - docs
