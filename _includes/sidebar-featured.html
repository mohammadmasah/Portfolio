<div class="sticky-top sticky-top-offset">
  <h4 class="font-weight-bold spanborder"><span>{{ t.team_projects }}</span></h4>
  <ol class="list-featured card-zoom">
    {% for project in all_projects %}{% if project.tags contains 'featured' %}
    <li class="mb-4"><h6 class="font-weight-bold"><a href="{{ project.url | relative_url }}" class="text-dark">{{ project.title }}</a></h6><a class="btn btn-dark btn-sm" href="{{ project.url | relative_url }}">{{ t.see_more }}</a></li>
    {% endif %}{% endfor %}
  </ol>
</div>
