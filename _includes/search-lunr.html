<form class="bd-search" id="portfolio-search-form" action="{{ '/categories.html' | prepend: locale_prefix | relative_url }}" method="get">
  <label class="sr-only" for="lunrsearch">{{ t.search_label }}</label>
  <input type="search" class="form-control text-small" id="lunrsearch" name="q" placeholder="{{ t.search_placeholder }}" required>
</form>
<dialog class="portfolio-search-dialog" id="portfolio-search-dialog" aria-labelledby="portfolio-search-title" data-empty="{{ t.search_empty }}">
  <div class="portfolio-search-heading"><h2 id="portfolio-search-title">{{ t.search_results }}</h2><button type="button" id="portfolio-search-close">{{ t.close }} ×</button></div>
  <p id="portfolio-search-query"></p><ul id="portfolio-search-list"></ul>
</dialog>
{% assign searchable_pages = site.pages | where: 'lang', language | where: 'searchable', true %}
{% assign search_documents = all_projects | concat: searchable_pages %}
<script type="application/json" id="portfolio-search-data">[
{% for document in search_documents %}{
  "url": {{ document.url | relative_url | jsonify }},
  "title": {{ document.title | jsonify }},
  "description": {{ document.description | default: '' | jsonify }},
  "body": {% if document.layout == 'post' %}{{ document.content | strip_html | strip_newlines | jsonify }}{% else %}""{% endif %}
}{% unless forloop.last %},{% endunless %}{% endfor %}
]</script>
<script src="{% include asset-url.html path='/assets/js/search.js' %}" defer></script>
