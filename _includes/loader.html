<template id="intro-template">
<div id="ultimate-loader">
  <div class="loader-layer layer-1"></div>
  <div class="loader-layer layer-2"></div>
  <div class="loader-layer layer-3"></div>
  
  <div class="loader-content">
    <div class="loader-text-wrapper">
    <span class="l-text">LOGIC</span>
    <span class="l-text">CODE</span>
    <span class="l-text">INNOVATE</span>
</div>
  </div>
</div>
</template>
<script>
  (function () {
    var template = document.getElementById("intro-template");
    if (document.documentElement.classList.contains("show-intro")) {
      template.before(template.content.cloneNode(true));
    }
    template.remove();
  }());
</script>
